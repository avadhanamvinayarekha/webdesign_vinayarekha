<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculator</title>
<link rel="stylesheet" href="style.css" />
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script defer src="script.js"></script>
</head>
<body class="page page-login">
    
  <main class="container" style="max-width: 520px;">
    <h1 style="margin: 1rem 0;">Sign in</h1>

    <form id="loginForm" novalidate>
      <div class="form-control">
        <label for="email">Northeastern Email</label>
        <input type="email" id="email" placeholder="yourname@northeastern.edu" />
        <small class="error" id="emailError"></small>
      </div>

      <div class="form-control">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="min 8 characters" />
        <small class="error" id="passwordError"></small>
      </div>

      <div class="form-row between" style="margin: .5rem 0 1rem;">
        <label class="checkbox">
          <input type="checkbox" id="rememberMe" /> Remember me
        </label>
      </div>

      <button id="btnLogin" class="btn btn-primary" type="submit" disabled>Login</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </main>
</body>
</html>
