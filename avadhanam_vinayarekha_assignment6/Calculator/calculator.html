<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculator App</title>
<link rel="stylesheet" href="style.css" />
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script defer src="script.js"></script>
</head>
<body class="page page-calculator">
  <header class="container" style="display:flex;justify-content:space-between;align-items:center;margin:1rem auto;">
    <h1 style="margin:0;">Welcome, <span id="welcomeName">User</span>!</h1>
    <button id="btnLogout" class="btn btn-danger">Logout</button>
  </header>

  <main class="container" style="max-width: 720px;">
    <h2 style="margin: .5rem 0 1rem;">Calculator</h2>

    <div class="grid two">
      <div class="form-control">
        <label for="num1">Number 1</label>
        <input type="text" id="num1" />
        <small class="error" id="num1Error"></small>
      </div>

      <div class="form-control">
        <label for="num2">Number 2</label>
        <input type="text" id="num2" />
        <small class="error" id="num2Error"></small>
      </div>
    </div>

    <div class="actions" style="margin-top: .75rem;">
      <button class="btn" data-op="add">Add</button>
      <button class="btn" data-op="subtract">Subtract</button>
      <button class="btn" data-op="multiply">Multiply</button>
      <button class="btn" data-op="divide">Divide</button>
    </div>

    <div class="form-control" style="margin-top: .5rem;">
      <label for="result">Result</label>
      <input type="text" id="result" readonly />
    </div>
  </main>
</body>
</html>
