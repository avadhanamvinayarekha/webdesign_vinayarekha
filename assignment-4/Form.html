<!doctype html>
<html lang="en">
 <head>
  <title>Feedback</title>
	<link rel="stylesheet" href="styles.css">
  <style>
    label {	float: left;
			width: 150px;}
      #container{
          width: auto;
          margin: auto;
          background-color: beige;
      } 
      main{
          padding: 50px;
      }
  </style>
 </head>
 <body>
 <div id="container">
	 
	 <main>
	 <h2>Feeback</h2>
	 <h3>Love something? Hate something? Let us know!</h3>
		 Note : Fields marked with an asterisk(*) are mandatory
		 <br><br>
		
<button id="btnAi" type="button" aria-controls="aiChat" aria-expanded="false" class="ai-btn">AI Assistant</button>


<div id="aiChat" class="ai-chat" hidden>
  <div class="ai-head">
    <strong>Form Helper</strong>
    <button id="btnAiClose" type="button" aria-label="Close chat">✕</button>
  </div>
  <div id="aiMsgs" class="ai-msgs" role="log" aria-live="polite" aria-relevant="additions"></div>
  <form id="aiForm" class="ai-input" onsubmit="return false;">
    <input id="aiQ" type="text" placeholder="Ask about email, phone, zip, required…" autocomplete="off" />
    <button id="aiSend" type="submit">Send</button>
  </form>
</div>

		 <form id="feedbackForm" method="post" novalidate>
			<label>Title*:</label>
			<input type="radio" name="title" id="miss" value="miss" required="required"/>Miss
			<input type="radio" name="title" id="mr" value="mr" required="required"/>Mr.
			<input type="radio" name="title" id="mrs" value="mrs" required="required"/>Mrs.
			<span class="error" id="error-title"></span>
			<br><br>
			<label for="firstName">First Name*:</label>
			<input type="text" name="firstName" id="firstName" placeholder="First Name"/>
			<span class="error" id="error-firstName"></span>	
			<br><br>
			

			<label for="lastName">Last Name*:</label>
			<input type="text" name="lastName" id="lastName" placeholder="Last Name"/>
			<span class="error" id="error-lastName"></span>
			<br><br>
			

			<label for="emailId">Email Id*:</label>
			<input type="text" name="emailId" id="emailId" placeholder="yourname@domain.com"/>
			<span class="error" id="error-emailId"></span>
			<br><br>
			

			<label for="phoneNumber">Phone Number*:</label>
			<input type="text" name="phoneNumber" id="phoneNumber" placeholder="xxx-xxx-xxxx"/>
			<span class="error" id="error-phoneNumber"></span>
			<br><br>
			
            <label for="zipcode">ZipCode*:</label>
			<input type="text" name="zipcode" id="zipcode" placeholder="xxxxxx"/>
			<span class="error" id="error-zipcode"></span>
			<br><br>
			
			<label for="listBox">Pick a topic*:</label>
				<select id="listBox">
  				<option value="">-- Select --</option>
  				<option value="Website Feedback">Website Feedback</option>
  				<option value="Support Request">Support Request</option>
  				<option value="Feature Idea">Feature Idea</option>
  				<option value="Bug Report">Bug Report</option>
  				<option value="General Query">General Query</option>
				</select>
				<span class="error" id="error-listBox"></span>
				<br><br>


				<div id="dynamicBox"></div>

			<div id="dynamicTextSlot" style="margin-top:6px;"></div>
			<br>

				<label for="address1">Street Address 1*:</label>
<input type="text" id="address1" placeholder="123 Main St" maxlength="60">
<span class="error" id="error-address1"></span>
<br><br>

<label for="address2">Street Address 2 (optional):</label>
<input type="text" id="address2" placeholder="Apt, Unit, Suite" maxlength="20">
<span class="error" id="error-address2"></span>
<br><br>




            <label for="zipcode">How did you hear*:</label>
			<input type='checkbox' name="source" value="facebook" /> Facebook
            <input type='checkbox' name="source" value="google" /> Google
            <input type='checkbox' name="source" value="yelp" /> Yelp 
			<span class="error" id="error-source"></span>
			<br><br> 
             
			<label for="comments">Comments*:</label>
			<textarea name="text" id="comments" placeholder="Your comments" rows="5" cols="25"></textarea>
			<span class="error" id="error-comments"></span>
			<br><br>
			<input type="Submit"  id="btnSubmit" disabled>
			<input type="Reset">
			<br><br>
		 </form>
		 <section id="results"></section>

	 </main>
 </div>

 <script src="script.js">
	
 </script>

 </body>
</html>
